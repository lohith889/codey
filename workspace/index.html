<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
      text-align: center;
    }
    .card {
      background: #fff;
      padding: 2rem 3rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 90%;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #e54c4c;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.5;
      margin: 1rem 0;
    }
    .cake {
      width: 120px;
      height: 120px;
      margin: 1rem auto;
      background: #f5deb3;
      border-radius: 0 0 50% 50%;
      position: relative;
    }
    .cake::before {
      content: '';
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 50% 30%, #ff6666, #e60000);
      border-radius: 50%;
    }
    .cake::after {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 30px;
      background: #ffeb3b;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy Birthday!</h1>
    <div class="cake"></div>
    <p>Wishing you a day filled with love, laughter, and unforgettable moments. May your year ahead be as bright and joyful as you are.</p>
    <p>Enjoy every slice of your special day!</p>
  </div>
</body>
</html>
